# Réglages Netlify pour PremierJob (lus automatiquement à chaque déploiement).
# Site statique : rien à construire. Le dossier « site » est publié tel quel,
# et la fonction « offre » (netlify/edge-functions) sert l'aperçu de partage /o/<id>.
[build]
  base    = "premierjob-saas/premierjob-saas"
  publish = "site"
  command = "echo 'Site statique : rien à construire'"

# La page admin ne doit pas apparaître dans Google.
[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
