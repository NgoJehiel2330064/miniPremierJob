# Réglages Netlify pour PremierJob (lus automatiquement à chaque déploiement).
# Site statique : rien à construire. Le dossier « site » est publié tel quel,
# et la fonction « offre » (netlify/edge-functions) sert l'aperçu de partage /o/<id>.
[build]
  base    = "premierjob-saas/premierjob-saas"
  publish = "site"
  command = "echo 'Site statique : rien à construire'"

# La page admin ne doit pas apparaître dans Google.
[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Liens collés dans un courriel : Gmail y ajoute parfois « &source=gmail&ust=… » ;
# on renvoie ces adresses mal formées vers la bonne page au lieu d'afficher une erreur 404.
[[redirects]]
  from   = "/employeur.html&*"
  to     = "/employeur.html"
  status = 301

[[redirects]]
  from   = "/employeur&*"
  to     = "/employeur.html"
  status = 301

[[redirects]]
  from   = "/&*"
  to     = "/"
  status = 301

# Anciennes demandes d'icône d'écran d'accueil (iPhone) : même image.
[[redirects]]
  from   = "/apple-touch-icon-precomposed.png"
  to     = "/apple-touch-icon.png"
  status = 200
